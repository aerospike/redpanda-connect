# Local write benchmark for output.aerospike.
# Record shape matches the shared 512-byte loader profile used by
# kafka-inbound and redpanda-inbound (name is 512 bytes; key, namespace,
# and ttl are not stored as bins). Batching defaults match the GKE pipeline
# in the aerospike-connect repository, perftests profile redpanda-inbound:
# count 10, period 200ms.
# This run has no broker. It writes to a single-node Enterprise server
# and measures the output, not the full loader path.

http:
  enabled: true
  address: 127.0.0.1:4195
  debug_endpoints: true

metrics:
  prometheus:
    add_process_metrics: true
    add_go_metrics: true

input:
  generate:
    count: ${COUNT:100000}
    interval: ""
    mapping: |
      root.key = counter()
      root.namespace = "test"
      root.ttl = 15000
      root.name = ""

pipeline:
  processors:
    - benchmark:
        interval: 1s
        count_bytes: true

output:
  aerospike:
    hosts: [ "127.0.0.1:3310" ]
    cluster_name: redpanda-demo
    namespace: test
    set: players
    key: '${! json("key") }'
    bins: 'root = this.without("key", "namespace", "ttl")'
    operation: replace
    ttl: '${! json("ttl").or("keep") }'
    batching:
      count: ${BATCH:10}
      period: ${PERIOD:200ms}

logger:
  level: INFO
  format: logfmt
