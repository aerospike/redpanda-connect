service {
    proto-fd-max 15000
    cluster-name redpanda-demo
    feature-key-file /etc/aerospike/features.conf
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
        # Published host port. Docker Desktop on macOS cannot use the
        # bridge address the server would otherwise advertise.
        access-address 127.0.0.1
        access-port 3310
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        mesh-seed-address-port rpcn-aerospike-bench 3002
    }
    fabric {
        port 3001
    }
}

namespace test {
    replication-factor 1
    default-ttl 0
    nsup-period 10
    storage-engine memory {
        data-size 4G
    }
}
